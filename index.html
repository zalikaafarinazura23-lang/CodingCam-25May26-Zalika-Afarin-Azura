<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>

  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container">

    <header>
      <h1>Expense Tracker</h1>
      <p>Track your spending beautifully</p>
    </header>

    <section class="balance-card">
      <h2>Total Balance</h2>
      <h1 id="balance">Rp 0</h1>
    </section>

    <section class="form-section">
      <form id="transaction-form">

        <div class="input-group">
          <label>Item Name</label>
          <input type="text" id="item-name" placeholder="Coffee" />
        </div>

        <div class="input-group">
          <label>Amount</label>
          <input type="number" id="item-amount" placeholder="50000" />
        </div>

        <div class="input-group">
          <label>Category</label>
          <select id="item-category">
            <option value="">Choose Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
          </select>
        </div>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="summary-section">
      <div class="summary-card">
        <h3>Monthly Summary</h3>
        <p id="monthly-total">Rp 0</p>
      </div>

      <div class="summary-card limit-card">
        <h3>Warning</h3>
        <p id="limit-warning">Safe Spending</p>
      </div>
    </section>

    <section class="chart-section">
      <canvas id="expenseChart"></canvas>
    </section>

    <section class="controls">
      <button id="sort-btn">Sort by Amount</button>
      <button id="theme-toggle">Dark Mode</button>
    </section>

    <section class="transaction-section">
      <h2>Transactions</h2>

      <div class="transaction-list" id="transaction-list">
      </div>
    </section>

  </div>
</body>
<script src="/script.js"></script>
</html>
